<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jacob's Christmas List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        /*
VOICE: warm, quiet, a little festive; a list family can use in ten seconds
IDEA: a gift tag on a pine-dark night, snow drifting past
PICTURE: the list itself, under a small hand-drawn star and gentle snowfall
COLOUR and TYPE: near-black #09090a, snow white #f4f4f5, cranberry red #e5484d; Fraunces titles, Inter body
LAYOUT: one centred column, item rows as full-width links, stacks naturally on phones
*/
        :root {
            color-scheme: dark;
            --bg: #09090a;
            --panel: #131315;
            --line: #25252a;
            --ink: #f4f4f5;
            --muted: #9b9ba3;
            --berry: #e5484d;
            --pine: #46c47a
        }

        ::selection {
            background: rgba(70, 196, 122, .35);
            color: #fff
        }

        * {
            box-sizing: border-box;
            min-width: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            background: radial-gradient(900px 480px at 50% -12%, rgba(229, 72, 77, .13) 0%, rgba(9, 9, 10, 0) 65%) fixed, var(--bg);
            color: var(--ink);
            font: 16px/1.55 Inter, system-ui, sans-serif;
            overflow-x: clip
        }

        #snow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 55
        }

        #intro {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            place-items: center;
            overflow: hidden;
            cursor: pointer
        }

        #intro .half {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            background-color: #8f1a20;
            background-image: radial-gradient(circle, rgba(255, 255, 255, .16) 1.4px, transparent 1.9px), repeating-linear-gradient(45deg, rgba(0, 0, 0, .09) 0 14px, transparent 14px 28px);
            background-size: 36px 36px, auto;
            box-shadow: inset 0 0 160px rgba(0, 0, 0, .55)
        }

        #intro .l {
            left: 0
        }

        #intro .r {
            right: 0
        }

        #intro .half::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 16px
        }

        #intro .l::after {
            right: 0;
            background: linear-gradient(90deg, #c99a3a 0 3px, #1d6a3e 3px)
        }

        #intro .r::after {
            left: 0;
            background: linear-gradient(90deg, #1d6a3e calc(100% - 3px), #c99a3a 0)
        }

        #intro .card {
            position: relative;
            z-index: 2;
            display: grid;
            justify-items: center
        }

        #intro .bow {
            width: 150px;
            height: 92px;
            margin-bottom: -24px;
            position: relative;
            z-index: 1
        }

        #intro .tag {
            display: grid;
            place-items: center;
            background: #f4f4f5;
            color: #141416;
            border-radius: 12px;
            padding: 34px clamp(22px, 5vw, 44px) 30px;
            width: min(520px, 86vw);
            min-height: 150px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .45)
        }

        #intro .ln {
            grid-area: 1/1;
            margin: 0;
            font-family: Fraunces, Georgia, serif;
            opacity: 0;
            text-wrap: balance
        }

        #intro .ln1 {
            font-weight: 600;
            font-size: clamp(26px, 5vw, 40px);
            line-height: 1.1
        }

        #intro .ln2 {
            font-weight: 500;
            font-size: clamp(20px, 3.6vw, 27px);
            line-height: 1.3
        }

        #intro .skip {
            position: absolute;
            bottom: 22px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, .6);
            z-index: 2
        }

        body.locked {
            overflow: hidden
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 720px;
            margin: 0 auto;
            padding: clamp(84px, 11vw, 120px) max(5vw, 18px) 56px
        }

        #lights {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            pointer-events: none;
            z-index: 0;
            overflow: visible
        }

        #lights .b {
            animation: tw 2.6s ease-in-out infinite alternate
        }

        @keyframes tw {
            from {
                opacity: 1
            }

            to {
                opacity: .4
            }
        }

        #sleigh {
            position: fixed;
            left: 0;
            top: 16vh;
            width: clamp(160px, 24vw, 250px);
            color: rgba(244, 244, 245, .22);
            pointer-events: none;
            z-index: 0;
            opacity: 0
        }

        #sleigh .team {
            animation: bob 1.1s ease-in-out infinite alternate
        }

        @keyframes bob {
            from {
                transform: translateY(0)
            }

            to {
                transform: translateY(3px)
            }
        }

        header {
            text-align: center;
            margin-bottom: clamp(28px, 5vw, 44px)
        }

        .star {
            width: 38px;
            height: 38px;
            display: block;
            margin: 0 auto 18px
        }

        h1 {
            font-family: Fraunces, Georgia, serif;
            font-weight: 600;
            font-size: clamp(34px, 6vw, 50px);
            line-height: 1.05;
            margin: 0 0 12px;
            text-wrap: balance;
            letter-spacing: -.01em
        }

        .sub {
            color: var(--muted);
            margin: 0 auto;
            max-width: 44ch;
            font-size: 16px
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px
        }

        a.item,
        div.item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            background: color-mix(in srgb, var(--panel) 88%, transparent);
            border: 1px solid var(--line);
            border-radius: 14px;
            color: inherit;
            text-decoration: none;
            min-height: 44px;
            transition: border-color .2s, transform .2s, background .2s
        }

        a.item:hover {
            border-color: color-mix(in srgb, var(--pine) 60%, var(--line));
            background: var(--panel);
            transform: translateY(-1px)
        }

        a.item:focus-visible {
            outline: 2px solid var(--pine);
            outline-offset: 3px
        }

        .store {
            font-size: 13px;
            color: var(--muted);
            margin: 0 0 2px
        }

        .name {
            font-family: Fraunces, Georgia, serif;
            font-weight: 500;
            font-size: 20px;
            line-height: 1.25;
            margin: 0
        }

        .size {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px
        }

        .chip {
            font-size: 13px;
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            color: var(--ink);
            white-space: nowrap
        }

        .chip.any {
            color: var(--muted)
        }

        .go {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--pine);
            white-space: nowrap
        }

        .go svg {
            width: 16px;
            height: 16px;
            transition: transform .2s
        }

        a.item:hover .go svg,
        a.go:hover svg {
            transform: translateX(3px)
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end
        }

        a.go {
            text-decoration: none;
            min-height: 28px
        }

        a.go:focus-visible {
            outline: 2px solid var(--pine);
            outline-offset: 3px;
            border-radius: 4px
        }

        footer {
            text-align: center;
            color: var(--muted);
            margin-top: 36px;
            font-size: 15px
        }

        footer span {
            color: var(--berry)
        }

        .more {
            margin: 0 0 8px;
            font-size: 14px
        }

        @media(max-width:520px) {

            a.item,
            div.item {
                grid-template-columns: 1fr;
                gap: 12px
            }

            .go {
                justify-self: start
            }

            .links {
                flex-direction: row;
                gap: 18px;
                align-items: center
            }

            .name {
                font-size: 19px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            #snow,
            #sleigh,
            #intro {
                display: none
            }

            #lights .b {
                animation: none
            }

            a.item,
            .go svg {
                transition: none
            }
        }
    </style>
</head>

<body class="locked">
    <div id="intro" aria-label="Welcome">
        <div class="half l"></div>
        <div class="half r"></div>
        <div class="card">
            <svg class="bow" viewBox="0 0 92 56" aria-hidden="true">
                <path d="M46 30 C30 4 6 6 8 24 C10 40 32 38 46 30 Z" fill="#1d6a3e" stroke="#c99a3a" stroke-width="2" />
                <path d="M46 30 C62 4 86 6 84 24 C82 40 60 38 46 30 Z" fill="#1d6a3e" stroke="#c99a3a"
                    stroke-width="2" />
                <path d="M42 32 L30 54 M50 32 L62 54" stroke="#1d6a3e" stroke-width="7" stroke-linecap="round" />
                <circle cx="46" cy="30" r="8" fill="#c99a3a" />
            </svg>
            <div class="tag">
                <p class="ln ln1">Welcome to Jacob's Christmas List</p>
                <p class="ln ln2">Feel free to get anything on here, or a gift of your choosing.</p>
            </div>
        </div>
        <p class="skip">Tap to open</p>
    </div>
    <canvas id="snow" aria-hidden="true"></canvas>
    <svg id="lights" aria-hidden="true"></svg>
    <svg id="sleigh" viewBox="0 0 280 60" aria-hidden="true">
        <defs>
            <g id="deer" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="0" cy="0" rx="15" ry="5.5" stroke="none" />
                <path d="M10 -3 L19 -12 L22 -10 L15 1 Z" stroke-width="1" />
                <ellipse cx="23" cy="-12" rx="5" ry="2.8" stroke="none" />
                <path d="M20 -14 L18 -22 M18 -22 L15 -26 M18 -22 L21 -27 M19 -18 L23 -21" fill="none"
                    stroke-width="1.3" />
                <path d="M9 2 L21 7 M7 3 L17 11 M-10 2 L-23 6 M-8 3 L-20 11" fill="none" stroke-width="2.2" />
                <path d="M-15 -2 L-19 -5" fill="none" stroke-width="2" />
            </g>
        </defs>
        <g class="team">
            <path d="M70 30 L238 22" fill="none" stroke="currentColor" stroke-width=".8" />
            <path d="M14 24 h40 q8 0 10 -10 h6 q-2 20 -18 20 h-34 q-8 0 -8 -8 z" fill="currentColor" />
            <path d="M8 42 h54 q8 0 10 -6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M22 34 v8 M54 34 v8" stroke="currentColor" stroke-width="1.6" />
            <use href="#deer" x="118" y="32" />
            <use href="#deer" x="176" y="28" />
            <use href="#deer" x="234" y="24" />
        </g>
    </svg>
    <main class="wrap">
        <header>
            <svg class="star" viewBox="0 0 40 40" aria-hidden="true">
                <path d="M20 3l4.6 10.7L36 15l-8.6 7.6L30 34l-10-6-10 6 2.6-11.4L4 15l11.4-1.3z" fill="none"
                    stroke="#e5484d" stroke-width="1.8" stroke-linejoin="round" />
            </svg>
            <h1>Jacob's Christmas List</h1>
            <p class="sub">Tap any item to open it. Sizes and colors are listed with each one.</p>
        </header>
        <ul id="list"></ul>
        <footer>
            <p class="more">More items may be added, so check back.</p>Thank you, and merry Christmas
            <span>&#10086;</span>
        </footer>
    </main>
    <script>
        {
            const items = [
                { name: "578 Baggy Jeans", store: "Levi's", tags: ["Waist 28", "Length 32"], url: "https://www.levi.com/US/en_US/clothing/men/jeans/loose/578TM-baggy-mens-jeans/p/A47500020" },
                { name: "Y Eau de Parfum", store: "Yves Saint Laurent · Ulta", tags: ["Any size"], url: "https://www.ulta.com/p/y-eau-de-parfum-with-fresh-geranium-sensual-woods-pimprod2000239?sku=2534072" },
                { name: "MYSLF Eau de Parfum", store: "Yves Saint Laurent · Ulta", tags: ["Any size"], url: "https://www.ulta.com/p/myslf-eau-de-parfum-with-fresh-accord-warm-woods-pimprod2040826?sku=2614196" },
                { name: "Rhino Raglan Top", store: "Ecko", tags: ["Small", "Black"], url: "https://ecko.com/collections/tops/products/men-rhino-raglan-insert-001-black-eo35k2150-blk" },
                { name: "Double Take Straight Leg Pant", store: "Alo", tags: ["Small", "Anthracite"], url: "https://www.aloyoga.com/products/m5259r-double-take-straight-leg-pant-anthracite?variant=50662598967655" },
                { name: "MX Anywhere 3S Mouse", store: "Logitech", tags: ["Black"], url: "https://www.logitech.com/en-us/shop/p/mx-anywhere-3s.910-006928" },
                { name: "Mexico 66", store: "Onitsuka Tiger", tags: ["Size 26", "Black & white"], url: "https://www.onitsukatiger.com/jp/en-gl/product/mexico-66/1183c102_001.html" },
                { name: "Essential Slim Rib Henley", store: "Abercrombie & Fitch", tags: ["Small", "Black"], url: "https://www.abercrombie.com/shop/us/p/essential-slim-rib-henley-63404820?seq=05" },
                { name: "Gift Card", store: "Chipotle or Sweetgreen", tags: ["Either one", "Any amount"], links: [{ label: "Chipotle", url: "https://www.chipotle.com/giftcards" }, { label: "Sweetgreen", url: "https://gift.sweetgreen.com" }] },
                { name: "Anything you think I'd like", store: "Your pick", tags: ["Surprise me"] }
            ];
            const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
            const arrow = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            const body = i => `<div><p class="store">${esc(i.store)}</p><p class="name">${esc(i.name)}</p>
<div class="size">${i.tags.map(t => `<span class="chip${t === 'Any size' || t === 'Any amount' ? ' any' : ''}">${esc(t)}</span>`).join('')}</div></div>`;
            document.getElementById('list').innerHTML = items.map(i => !i.url && !i.links
                ? `<li><div class="item">${body(i)}</div></li>`
                : i.links
                    ? `<li><div class="item">${body(i)}<div class="links">${i.links.map(l => `<a class="go" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ${arrow}</a>`).join('')}</div></div></li>`
                    : `<li><a class="item" href="${esc(i.url)}" target="_blank" rel="noopener">${body(i)}<span class="go">View ${arrow}</span></a></li>`).join('');

            const c = document.getElementById('snow'), x = c.getContext('2d');
            let W = 0, H = 0, flakes = [];
            const size = () => {
                const d = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
                const n = Math.round(Math.min(90, W * H / 14000)); flakes = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.8, s: .25 + Math.random() * .6, d: Math.random() * Math.PI * 2 }))
            };
            const tick = () => {
                x.clearRect(0, 0, W, H); x.fillStyle = 'rgba(244,244,245,.5)';
                for (const f of flakes) {
                    f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .3; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W }
                    x.beginPath(); x.arc(f.x, f.y, f.r, 0, Math.PI * 2); x.fill()
                }
                requestAnimationFrame(tick)
            };
            const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!still) { size(); addEventListener('resize', size); tick() }

            const L = document.getElementById('lights'), cols = ['#e5484d', '#46c47a', '#ffe2a8', '#f2b544'];
            const lights = () => {
                const w = document.documentElement.clientWidth, seg = Math.max(110, Math.min(170, w / 6)), n = Math.ceil(w / seg), y0 = 6, sag = 20;
                let d = `M0 ${y0}`, b = '', k = 0;
                for (let s = 0; s < n; s++) {
                    const x0 = s * seg; d += ` Q${x0 + seg / 2} ${y0 + sag * 2} ${x0 + seg} ${y0}`;
                    for (const t of [.2, .4, .6, .8]) {
                        const px = x0 + seg * t, py = y0 + 4 * sag * t * (1 - t), c = cols[k++ % cols.length];
                        b += `<g class="b" style="animation-delay:${(-Math.random() * 3).toFixed(2)}s;animation-duration:${(2 + Math.random() * 2).toFixed(2)}s"><circle cx="${px}" cy="${py + 8}" r="10" fill="${c}" opacity=".2"/><rect x="${px - 1.6}" y="${py}" width="3.2" height="3.5" rx="1" fill="#55555c"/><ellipse cx="${px}" cy="${py + 8}" rx="3.2" ry="5" fill="${c}"/></g>`
                    }
                }
                L.setAttribute('viewBox', `0 0 ${w} 64`); L.innerHTML = `<path d="${d}" fill="none" stroke="#3a3a40" stroke-width="1.4"/>` + b
            };
            lights(); let lt; addEventListener('resize', () => { clearTimeout(lt); lt = setTimeout(lights, 150) });

            const sl = document.getElementById('sleigh');
            const fly = () => {
                const w = innerWidth;
                const a = sl.animate([{ transform: 'translate(-280px,40px)', opacity: 0 }, { opacity: 1, offset: .08 }, { transform: `translate(${w * .45}px,-12px)`, offset: .5 }, { opacity: 1, offset: .92 }, { transform: `translate(${w + 40}px,14px)`, opacity: 0 }], { duration: Math.max(11000, w * 12), easing: 'linear' });
                a.onfinish = () => setTimeout(fly, 20000 + Math.random() * 25000)
            };
            if (!still && sl.animate) setTimeout(fly, still ? 3000 : 10000);

            const intro = document.getElementById('intro');
            let opened = false;
            const done = () => { intro.remove(); document.body.classList.remove('locked') };
            const open = () => {
                if (opened) return; opened = true;
                const card = intro.querySelector('.card'), sk = intro.querySelector('.skip');
                card.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.94)' }], { duration: 450, fill: 'forwards', easing: 'ease-in' });
                sk.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
                const o = { duration: 1400, delay: 350, fill: 'forwards', easing: 'cubic-bezier(.7,0,.2,1)' };
                intro.querySelector('.l').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-101%)' }], o);
                const a = intro.querySelector('.r').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(101%)' }], o);
                a.onfinish = done
            };
            if (still || !intro.animate) { done() } else {
                intro.addEventListener('click', open);
                const wait = ms => new Promise(r => setTimeout(r, ms));
                const fade = (el, from, to, ms) => el.animate([{ opacity: from, transform: `translateY(${from ? 0 : 8}px)` }, { opacity: to, transform: `translateY(${to ? 0 : -6}px)` }], { duration: ms, fill: 'forwards', easing: 'ease' }).finished;
                const l1 = intro.querySelector('.ln1'), l2 = intro.querySelector('.ln2');
                (async () => {
                    await wait(400); if (opened) return; await fade(l1, 0, 1, 800); await wait(1500); if (opened) return;
                    await fade(l1, 1, 0, 500); if (opened) return; await fade(l2, 0, 1, 700); await wait(2300); if (opened) return; open()
                })();
                setTimeout(() => { if (document.body.contains(intro)) open() }, 15000)
            }
        }
    </script>
</body>

</html>
